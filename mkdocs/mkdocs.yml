      - 🔶First Project: getting-started/first-project.md
      - 🔶Programming Quickstart: getting-started/programming-quickstart.md
  - Editor Manual:
      - editor/index.md
      - 🔶Projects: editor/projects.md
      - 🔶Asset Manager: editor/asset-manager.md
      - Project Items:
          - editor/items/index.md
          - 🔸Sprites: editor/items/sprites.md
          - 🔸Tile Map: editor/items/tilemap.md
          - 🔸Text: editor/items/text.md
          - 🔸Particles: editor/items/particles.md
          - 🔸Spine: editor/items/spine.md
          - 🔸Audio: editor/items/audio.md
          - 🔸Entity: editor/items/entity.md
      - 🔶TileSets: editor/tilesets.md
  - Programming Manual:
      - programming/index.md
      - 🔶Windows & Cameras: programming/windows-cameras.md
      - 🔶Scene Management:
